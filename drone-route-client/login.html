<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход | Drone Route Planner</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Собственные стили -->
  <link rel="stylesheet" href="./css/main.css">
  
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    
    .auth-container {
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }
    
    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .auth-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 10px;
    }
    
    .auth-header p {
      color: #718096;
      font-size: 14px;
    }
    
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      padding: 12px;
      font-weight: 600;
      border-radius: 10px;
      transition: transform 0.2s;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    
    .divider {
      text-align: center;
      margin: 20px 0;
      color: #a0aec0;
      position: relative;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 45%;
      height: 1px;
      background: #e2e8f0;
    }
    
    .divider::before {
      left: 0;
    }
    
    .divider::after {
      right: 0;
    }
    
    .text-link {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }
    
    .text-link:hover {
      color: #764ba2;
      text-decoration: underline;
    }
    
    .alert {
      border-radius: 10px;
      border: none;
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>✈️ Вход в систему</h1>
        <p>Планировщик маршрутов для дронов</p>
      </div>
      
      <div id="errorMessage" class="alert alert-danger" style="display: none;" role="alert"></div>
      
      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input 
            type="email" 
            class="form-control" 
            id="email" 
            placeholder="your@email.com"
            required
            autocomplete="email"
          >
        </div>
        
        <div class="mb-3">
          <label for="password" class="form-label">Пароль</label>
          <input 
            type="password" 
            class="form-control" 
            id="password" 
            placeholder="Введите пароль"
            required
            autocomplete="current-password"
          >
        </div>
        
        <button type="submit" class="btn btn-primary w-100 mb-3" id="loginBtn">
          Войти
        </button>
      </form>
      
      <div class="divider">или</div>
      
      <div class="text-center">
        <p class="mb-0">
          Нет аккаунта? 
          <a href="register.html" class="text-link">Зарегистрироваться</a>
        </p>
        <p class="mt-2">
          <a href="index.html" class="text-link">← Вернуться к планировщику</a>
        </p>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Конфигурация -->
  <script src="./js/config.js"></script>
  
  <!-- Auth module -->
  <script src="./js/modules/auth.js"></script>
  
  <script>
    // Обработчик формы входа
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');
      const loginBtn = document.getElementById('loginBtn');
      
      // Скрываем ошибки
      errorDiv.style.display = 'none';
      
      // Показываем загрузку
      loginBtn.disabled = true;
      loginBtn.textContent = 'Вход...';
      
      try {
        const result = await AuthModule.login(email, password);
        
        if (result.success) {
          // Успешный вход - редирект
          window.location.href = 'profile.html';
        } else {
          // Показываем ошибку
          errorDiv.textContent = result.error || 'Ошибка входа';
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = 'Произошла ошибка. Попробуйте ещё раз.';
        errorDiv.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Войти';
      }
    });
    
    // Проверка: если уже авторизован, редирект в профиль
    if (AuthModule && AuthModule.isAuthenticated()) {
      window.location.href = 'profile.html';
    }
  </script>
</body>

</html>
