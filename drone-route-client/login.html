<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход | Drone Route Planner</title>
  
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/pages/auth.css">
</head>

<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand-icon" aria-hidden="true"><i data-lucide="plane"></i></div>
        <h1>Вход в систему</h1>
        <p>Планировщик маршрутов для дронов</p>
      </div>
      
      <div id="errorMessage" class="alert alert-danger" style="display: none;" role="alert"></div>
      
      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input 
            type="email" 
            class="form-control" 
            id="email" 
            placeholder="your@email.com"
            required
            autocomplete="email"
          >
        </div>
        
        <div class="mb-3">
          <label for="password" class="form-label">Пароль</label>
          <input 
            type="password" 
            class="form-control" 
            id="password" 
            placeholder="Введите пароль"
            required
            autocomplete="current-password"
          >
        </div>
        
        <button type="submit" class="btn btn-primary w-100 mb-3 btn-lucide" id="loginBtn">
          <i data-lucide="log-in"></i><span>Войти</span>
        </button>
      </form>
      
      <div class="divider">или</div>
      
      <div class="text-center">
        <p class="mb-0">
          Нет аккаунта? 
          <a href="register.html" class="text-link">Зарегистрироваться</a>
        </p>
        <p class="mt-2">
          <a href="index.html" class="text-link">← Вернуться к планировщику</a>
        </p>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.525.0/dist/umd/lucide.min.js"></script>
  <script src="./js/icons.js"></script>
  
  <!-- Конфигурация -->
  <script src="./js/config.js"></script>
  
  <!-- Auth module -->
  <script src="./js/modules/auth.js"></script>
  
  <script>
    // Обработчик формы входа
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');
      const loginBtn = document.getElementById('loginBtn');
      
      // Скрываем ошибки
      errorDiv.style.display = 'none';
      
      // Показываем загрузку
      loginBtn.disabled = true;
      loginBtn.querySelector('span').textContent = 'Вход...';
      
      try {
        const result = await AuthModule.login(email, password);
        
        if (result.success) {
          // Успешный вход - редирект
          window.location.href = 'profile.html';
        } else {
          // Показываем ошибку
          errorDiv.textContent = result.error || 'Ошибка входа';
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = 'Произошла ошибка. Попробуйте ещё раз.';
        errorDiv.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.querySelector('span').textContent = 'Войти';
      }
    });
    
    // Проверка: если уже авторизован, редирект в профиль
    if (AuthModule && AuthModule.isAuthenticated()) {
      window.location.href = 'profile.html';
    }

    if (typeof refreshLucideIcons === 'function') {
      refreshLucideIcons();
    }
  </script>
</body>

</html>
