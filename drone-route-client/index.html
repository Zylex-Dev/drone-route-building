<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Автоматизированное планирование маршрута беспилотника</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <!-- Leaflet.draw CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
  <!-- Собственные стили -->
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <!-- Кнопка переключения темы вынесена в отдельный контейнер -->
  <div id="themeToggleContainer">
    <button id="themeToggle" class="theme-toggle btn">🌙 Темная тема</button>
  </div>

  <div class="container-fluid h-100">
    <div class="row h-100">
      <!-- Левая панель -->
      <aside class="col-md-3 p-0 sidebar">
        <div class="content">
          <div class="card-custom flight-settings glass">
            <h4>Настройки полёта</h4>
            <div class="mb-3">
              <label for="flightAltitude" class="form-label">Высота полёта (м)</label>
              <input type="number" class="form-control" id="flightAltitude" value="50" min="10" max="500" step="1">
            </div>
            <div class="mb-3">
              <label for="desiredOverlap" class="form-label">Перекрытие (%)</label>
              <input type="number" class="form-control" id="desiredOverlap" value="30" min="0" max="100" step="1">
            </div>
            <div class="mb-3">
              <label class="form-label">Тип съёмки</label>
              <input type="text" class="form-control" value="Панорамная съемка" disabled>
            </div>
            <div class="mb-3">
              <label for="droneModel" class="form-label">Модель дрона</label>
              <select class="form-select" id="droneModel">
                <option value="DJI Matrice 30T" selected>DJI Matrice 30T</option>
                <option value="DJI Mavic 3">DJI Mavic 3</option>
                <option value="DJI Phantom 4 Pro">DJI Phantom 4 Pro</option>
                <option value="DJI Air 2S">DJI Air 2S</option>
                <option value="DJI Mini 3 Pro">DJI Mini 3 Pro</option>
                <option value="Autel EVO Lite+">Autel EVO Lite+</option>
              </select>
            </div>
            <div class="mb-3">
              <button id="clearAll" class="btn btn-danger btn-custom w-100">Удалить всё</button>
            </div>
          </div>
          <div class="card-custom info-card glass">
            <h5>Параметры съёмки</h5>
            <ul class="list-group list-group-flush">
              <li class="list-group-item" id="focalLength">Фокусное расстояние: 4.5 мм</li>
              <li class="list-group-item" id="sensorWidth">Ширина матрицы: 7.6 мм</li>
              <li class="list-group-item" id="altitudeInfo">Высота полёта: - м</li>
              <li class="list-group-item" id="fovInfo">Горизонтальный угол обзора (rad): -</li>
              <li class="list-group-item" id="groundWidthInfo">Земная ширина кадра: - м</li>
              <li class="list-group-item" id="spacingInfo">Эффективный шаг между полосами: - м</li>
            </ul>
          </div>
        </div>
      </aside>
      <!-- Правая панель: карта -->
      <main class="col-md-9 p-0">
        <div id="map"></div>
      </main>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Leaflet.draw JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <!-- Конфигурация приложения -->
  <script src="./js/config.js"></script>
  <!-- Спецификации дронов -->
  <script src="./js/drone-specs.js"></script>
  <!-- Собственные скрипты -->
  <script src="./js/main.js"></script>
</body>

</html>
