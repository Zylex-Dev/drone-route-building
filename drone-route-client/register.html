<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация | Drone Route Planner</title>
  
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/pages/auth.css">
</head>

<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand-icon" aria-hidden="true"><i data-lucide="user-plus"></i></div>
        <h1>Регистрация</h1>
        <p>Создайте аккаунт для сохранения миссий</p>
      </div>
      
      <div id="errorMessage" class="alert alert-danger" style="display: none;" role="alert"></div>
      <div id="successMessage" class="alert alert-success" style="display: none;" role="alert"></div>
      
      <form id="registerForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input 
            type="email" 
            class="form-control" 
            id="email" 
            placeholder="your@email.com"
            required
            autocomplete="email"
          >
        </div>
        
        <div class="mb-3">
          <label for="password" class="form-label">Пароль</label>
          <input 
            type="password" 
            class="form-control" 
            id="password" 
            placeholder="Введите пароль"
            required
            autocomplete="new-password"
            minlength="8"
          >
          <div class="pwd-rules" id="passwordRules" aria-live="polite">
            <div class="pwd-rules__hint">Требования к паролю</div>
            <ul class="pwd-rules__list" role="list">
              <li class="pwd-rule" id="pwdRuleLen" data-rule="length">
                <span class="pwd-rule__mark" aria-hidden="true"></span>
                <span>Не менее 8 символов</span>
              </li>
              <li class="pwd-rule" id="pwdRuleLetter" data-rule="letter">
                <span class="pwd-rule__mark" aria-hidden="true"></span>
                <span>Хотя бы одна буква (латиница или кириллица)</span>
              </li>
              <li class="pwd-rule" id="pwdRuleDigit" data-rule="digit">
                <span class="pwd-rule__mark" aria-hidden="true"></span>
                <span>Хотя бы одна цифра</span>
              </li>
            </ul>
          </div>
        </div>
        
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
          <input 
            type="password" 
            class="form-control" 
            id="confirmPassword" 
            placeholder="Введите пароль повторно"
            required
            autocomplete="new-password"
          >
          <div id="passwordMismatch" class="text-danger" style="font-size: 12px; display: none; margin-top: 5px;">
            Пароли не совпадают
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary w-100 mb-3 btn-lucide" id="registerBtn">
          <i data-lucide="user-plus"></i><span>Зарегистрироваться</span>
        </button>
      </form>
      
      <div class="divider">или</div>
      
      <div class="text-center">
        <p class="mb-0">
          Уже есть аккаунт? 
          <a href="login.html" class="text-link">Войти</a>
        </p>
        <p class="mt-2">
          <a href="index.html" class="text-link">← Вернуться к планировщику</a>
        </p>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.525.0/dist/umd/lucide.min.js"></script>
  <script src="./js/icons.js"></script>
  
  <!-- Конфигурация -->
  <script src="./js/config.js"></script>
  
  <!-- Auth module -->
  <script src="./js/modules/auth.js"></script>
  
  <script>
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const mismatchDiv = document.getElementById('passwordMismatch');

    const LETTER_RE = /[a-zA-Zа-яА-ЯёЁ]/;

    function passwordRulesState(value) {
      return {
        length: value.length >= 8,
        letter: LETTER_RE.test(value),
        digit: /\d/.test(value)
      };
    }

    function passwordRulesMet(value) {
      const s = passwordRulesState(value);
      return s.length && s.letter && s.digit;
    }

    function updatePasswordRules() {
      const v = passwordInput.value;
      const s = passwordRulesState(v);
      document.getElementById('pwdRuleLen').classList.toggle('is-met', s.length);
      document.getElementById('pwdRuleLetter').classList.toggle('is-met', s.letter);
      document.getElementById('pwdRuleDigit').classList.toggle('is-met', s.digit);
    }
    
    // Проверка совпадения паролей
    function checkPasswordMatch() {
      if (confirmPasswordInput.value === '') {
        mismatchDiv.style.display = 'none';
        return true;
      }
      
      if (passwordInput.value !== confirmPasswordInput.value) {
        mismatchDiv.style.display = 'block';
        return false;
      } else {
        mismatchDiv.style.display = 'none';
        return true;
      }
    }
    
    confirmPasswordInput.addEventListener('input', checkPasswordMatch);
    passwordInput.addEventListener('input', () => {
      updatePasswordRules();
      checkPasswordMatch();
    });
    passwordInput.addEventListener('focus', updatePasswordRules);
    updatePasswordRules();
    
    // Обработчик формы регистрации
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');
      const registerBtn = document.getElementById('registerBtn');
      
      // Скрываем сообщения
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      
      // Проверка совпадения паролей
      if (password !== confirmPassword) {
        errorDiv.textContent = 'Пароли не совпадают';
        errorDiv.style.display = 'block';
        return;
      }

      if (!passwordRulesMet(password)) {
        errorDiv.textContent = 'Пароль не соответствует требованиям ниже';
        errorDiv.style.display = 'block';
        updatePasswordRules();
        return;
      }
      
      // Показываем загрузку
      registerBtn.disabled = true;
      registerBtn.querySelector('span').textContent = 'Регистрация...';
      
      try {
        const result = await AuthModule.register(email, password);
        
        if (result.success) {
          // Успешная регистрация
          successDiv.textContent = 'Регистрация успешна! Перенаправление...';
          successDiv.style.display = 'block';
          
          // Редирект в профиль через 1 секунду
          setTimeout(() => {
            window.location.href = 'profile.html';
          }, 1000);
        } else {
          // Показываем ошибку
          errorDiv.textContent = result.error || 'Ошибка регистрации';
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = 'Произошла ошибка. Попробуйте ещё раз.';
        errorDiv.style.display = 'block';
      } finally {
        registerBtn.disabled = false;
        registerBtn.querySelector('span').textContent = 'Зарегистрироваться';
      }
    });
    
    // Проверка: если уже авторизован, редирект в профиль
    if (AuthModule && AuthModule.isAuthenticated()) {
      window.location.href = 'profile.html';
    }

    if (typeof refreshLucideIcons === 'function') {
      refreshLucideIcons();
    }
  </script>
</body>

</html>
