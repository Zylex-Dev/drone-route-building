<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация | Drone Route Planner</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Собственные стили -->
  <link rel="stylesheet" href="./css/main.css">
  
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    
    .auth-container {
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }
    
    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .auth-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 10px;
    }
    
    .auth-header p {
      color: #718096;
      font-size: 14px;
    }
    
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      padding: 12px;
      font-weight: 600;
      border-radius: 10px;
      transition: transform 0.2s;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    
    .divider {
      text-align: center;
      margin: 20px 0;
      color: #a0aec0;
      position: relative;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 45%;
      height: 1px;
      background: #e2e8f0;
    }
    
    .divider::before {
      left: 0;
    }
    
    .divider::after {
      right: 0;
    }
    
    .text-link {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }
    
    .text-link:hover {
      color: #764ba2;
      text-decoration: underline;
    }
    
    .alert {
      border-radius: 10px;
      border: none;
    }
    
    .password-requirements {
      font-size: 12px;
      color: #718096;
      margin-top: 5px;
    }
    
    .password-requirements ul {
      margin: 5px 0;
      padding-left: 20px;
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>🚁 Регистрация</h1>
        <p>Создайте аккаунт для сохранения миссий</p>
      </div>
      
      <div id="errorMessage" class="alert alert-danger" style="display: none;" role="alert"></div>
      <div id="successMessage" class="alert alert-success" style="display: none;" role="alert"></div>
      
      <form id="registerForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input 
            type="email" 
            class="form-control" 
            id="email" 
            placeholder="your@email.com"
            required
            autocomplete="email"
          >
        </div>
        
        <div class="mb-3">
          <label for="password" class="form-label">Пароль</label>
          <input 
            type="password" 
            class="form-control" 
            id="password" 
            placeholder="Введите пароль"
            required
            autocomplete="new-password"
            minlength="8"
          >
          <div class="password-requirements">
            Требования к паролю:
            <ul>
              <li>Минимум 8 символов</li>
              <li>Хотя бы одна буква</li>
              <li>Хотя бы одна цифра</li>
            </ul>
          </div>
        </div>
        
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
          <input 
            type="password" 
            class="form-control" 
            id="confirmPassword" 
            placeholder="Введите пароль повторно"
            required
            autocomplete="new-password"
          >
          <div id="passwordMismatch" class="text-danger" style="font-size: 12px; display: none; margin-top: 5px;">
            Пароли не совпадают
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary w-100 mb-3" id="registerBtn">
          Зарегистрироваться
        </button>
      </form>
      
      <div class="divider">или</div>
      
      <div class="text-center">
        <p class="mb-0">
          Уже есть аккаунт? 
          <a href="login.html" class="text-link">Войти</a>
        </p>
        <p class="mt-2">
          <a href="index.html" class="text-link">← Вернуться к планировщику</a>
        </p>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Конфигурация -->
  <script src="./js/config.js"></script>
  
  <!-- Auth module -->
  <script src="./js/modules/auth.js"></script>
  
  <script>
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const mismatchDiv = document.getElementById('passwordMismatch');
    
    // Проверка совпадения паролей
    function checkPasswordMatch() {
      if (confirmPasswordInput.value === '') {
        mismatchDiv.style.display = 'none';
        return true;
      }
      
      if (passwordInput.value !== confirmPasswordInput.value) {
        mismatchDiv.style.display = 'block';
        return false;
      } else {
        mismatchDiv.style.display = 'none';
        return true;
      }
    }
    
    confirmPasswordInput.addEventListener('input', checkPasswordMatch);
    passwordInput.addEventListener('input', checkPasswordMatch);
    
    // Обработчик формы регистрации
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');
      const registerBtn = document.getElementById('registerBtn');
      
      // Скрываем сообщения
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      
      // Проверка совпадения паролей
      if (password !== confirmPassword) {
        errorDiv.textContent = 'Пароли не совпадают';
        errorDiv.style.display = 'block';
        return;
      }
      
      // Показываем загрузку
      registerBtn.disabled = true;
      registerBtn.textContent = 'Регистрация...';
      
      try {
        const result = await AuthModule.register(email, password);
        
        if (result.success) {
          // Успешная регистрация
          successDiv.textContent = 'Регистрация успешна! Перенаправление...';
          successDiv.style.display = 'block';
          
          // Редирект в профиль через 1 секунду
          setTimeout(() => {
            window.location.href = 'profile.html';
          }, 1000);
        } else {
          // Показываем ошибку
          errorDiv.textContent = result.error || 'Ошибка регистрации';
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = 'Произошла ошибка. Попробуйте ещё раз.';
        errorDiv.style.display = 'block';
      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = 'Зарегистрироваться';
      }
    });
    
    // Проверка: если уже авторизован, редирект в профиль
    if (AuthModule && AuthModule.isAuthenticated()) {
      window.location.href = 'profile.html';
    }
  </script>
</body>

</html>
