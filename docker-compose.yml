services:
  server:
    build:
      context: .
      dockerfile: ./drone-route-server/Dockerfile.server
    container_name: drone_route_server
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./drone-route-server/logs:/app/drone-route-server/logs
    environment:
      - LOG_LEVEL=debug
      - LOG_DIR=./logs
      - NODE_ENV=production
    networks:
      - drone-network

  client:
    build:
      context: .
      dockerfile: ./drone-route-client/Dockerfile.client
    container_name: drone_route_client
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - drone-network

networks:
  drone-network:
    driver: bridge
